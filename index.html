
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Old Galaxy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:white;font-family:Arial,"Apple SD Gothic Neo",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
#phone{max-width:430px;min-height:100dvh;margin:auto;background:#07101e;overflow:hidden}
.status{height:28px;background:#17191d;display:flex;justify-content:space-between;padding:5px 12px;font-size:13px}
.screen{min-height:calc(100dvh - 76px)}
.wallpaper{background:radial-gradient(ellipse at 25% 15%,#d7f7ff 0%,#7edbff 15%,transparent 38%),radial-gradient(ellipse at 85% 38%,#63d7ff 0%,transparent 35%),linear-gradient(145deg,#159be9,#0873df 45%,#063d9d 80%,#05235e)}
.lock{text-align:center;padding:48px 20px}
.clock{font-size:64px;font-weight:300}
.date{margin-top:8px}
.notice{margin:40px 0 22px;background:#092f5b9c;padding:14px;border-radius:9px}
.pattern{display:grid;grid-template-columns:repeat(3,45px);gap:24px;justify-content:center;margin:22px}
.dot{width:42px;height:42px;border:3px solid #d7efff99;border-radius:50%;background:#bce8ff44}
.unlock{border:1px solid #ffffff88;border-radius:20px;background:#134e8a88;color:white;padding:10px 20px}
.home{padding:16px 13px 100px}
.widget{padding:18px;background:#a9e5ff36;border:1px solid #ffffff55;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.bigtime{font-size:40px;font-weight:300}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 5px;margin-top:32px}
.app{border:0;background:transparent;color:white;text-align:center;padding:0;text-shadow:0 2px 3px #123}
.appicon{width:54px;height:54px;border-radius:13px;margin:0 auto 7px;display:grid;place-items:center;font-size:27px;border:2px solid #ffffff66;box-shadow:inset 0 2px 4px #ffffff88}
.app span:last-child{font-size:12px}
.blue{background:linear-gradient(#83d6ff,#1473d0)}
.yellow{background:linear-gradient(#fff4a4,#e9b51c);color:#72521a}
.orange{background:linear-gradient(#ffd08d,#e97622)}
.purple{background:linear-gradient(#f2baff,#a345ce)}
.green{background:linear-gradient(#b5f3a3,#26a54c)}
.white{background:linear-gradient(#fff,#b9c7d8);color:#333}
.dock{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#052e65e8;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 4px}
.nav{height:48px;background:linear-gradient(#25282d,#090a0d);display:flex;justify-content:space-around;align-items:center;color:#bbb}
.page{background:#090a0d;min-height:calc(100dvh - 76px)}
.bar{height:52px;background:linear-gradient(#555b64,#17191d);padding:13px;font-size:18px;font-weight:bold;position:sticky;top:0;z-index:2}
.back{border:0;background:transparent;color:white;font-size:24px;margin-right:12px}
.rowitem{width:100%;border:0;border-bottom:1px solid #303136;background:#090a0d;color:white;text-align:left;display:flex;align-items:center;gap:12px;padding:12px;min-height:78px}
.avatar{width:52px;height:52px;border-radius:8px;background:linear-gradient(#777f8c,#404651);display:grid;place-items:center;font-size:25px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.rowtext{min-width:0;flex:1}
.name{font-size:16px;font-weight:bold;margin-bottom:7px}
.preview{color:#aaa;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:#999;font-size:11px;white-space:nowrap}
.badge{background:#329fe9;border-radius:20px;padding:4px 7px;display:inline-block;margin-top:5px}
.chathead{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;background:#17191e;border-bottom:1px solid #333}
.chathead .avatar{width:36px;height:36px}
.chatbody{padding:14px;min-height:50vh;display:flex;flex-direction:column;gap:12px}
.day{text-align:center;color:#888;font-size:12px;margin:8px}
.bubble{padding:11px 13px;border-radius:14px;max-width:82%;font-size:14px;line-height:1.5;background:#33363e;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.me{background:#267ed4;align-self:flex-end}
.btime{font-size:10px;color:#999;margin-top:4px}
.msgrow{display:flex;align-items:flex-end;gap:6px}
.msgrow.me{justify-content:flex-end}
.msgrow.me .btime{order:0}
.msgrow.me .bubble{order:1}
.chatinput{display:flex;gap:6px;padding:10px;background:#15171c;position:sticky;bottom:0}
.chatinput input{flex:1;min-width:0;border-radius:20px;border:1px solid #555;background:#282a30;color:white;padding:11px}
.send{background:#2789dc;color:white;border:0;border-radius:18px;padding:0 14px}
.form{padding:15px}
.form label{display:block;font-size:13px;color:#bbb;margin-top:13px}
.form input,.form textarea{width:100%;background:#22252c;color:white;border:1px solid #555;border-radius:7px;padding:11px;margin-top:6px}
.form textarea{min-height:100px;resize:vertical}
.btn{background:#2185d0;color:white;border:0;border-radius:7px;padding:11px 13px;margin:8px 5px 5px 0}
.secondary{background:#414650}
.info{padding:15px;color:#aaa;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div id="phone">
<div class="status"><span>✉</span><span>▮▮▮ 3G ▣ <span id="st">오후 11:48</span></span></div>
<main id="screen" class="screen wallpaper"></main>
<div class="nav"><span>▤</span><span>▱</span><span>↶</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const initial=[
{name:"시보-강민재",photo:"",time:"오후 11:32",messages:[{text:"저 아직 기다리고 있어요.",me:false,time:"오후 11:32"}]},
{name:"최종현",photo:"",time:"오후 10:58",messages:[{text:"차 검사. 나 아직 기다린다",me:false,time:"오후 10:58"}]},
{name:"장태식",photo:"",time:"4월 2일",messages:[{text:"어디 가실 거면 말이라도 하고 가지.",me:false,time:"오후 9:14"}]},
{name:"이예진 검사",photo:"",time:"3월 31일",messages:[{text:"몸 멀쩡히 잘 지내고 계신 거죠?",me:false,time:"오후 6:30"}]},
{name:"조아영",photo:"",time:"3월 27일",messages:[{text:"이게 무슨 초라한 꼴이야.",me:false,time:"오후 4:21"}]},
{name:"박정호",photo:"",time:"3월 7일",messages:[{text:"살아 있었으면 예순둘이에요. 그냥 생각나서요.",me:false,time:"오후 8:10"}]}
];
let people;
try{people=JSON.parse(localStorage.getItem("galaxyPeople"))||initial}catch(e){people=initial}
let current=0;
const save=()=>{try{localStorage.setItem("galaxyPeople",JSON.stringify(people))}catch(e){}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>{let d=new Date(),h=d.getHours();return (h>=12?"오후 ":"오전 ")+(h%12||12)+":"+String(d.getMinutes()).padStart(2,"0")};
function avatar(p){return `<span class="avatar">${p.photo?`<img src="${esc(p.photo)}" onerror="this.style.display='none'">`:"👤"}</span>`}
function app(icon,label,color,fn){return `<button class="app" onclick="${fn}"><span class="appicon ${color}">${icon}</span><span>${label}</span></button>`}
function showLock(){
$("screen").className="screen wallpaper";
$("screen").innerHTML=`<div class="lock"><div class="clock" id="clock">11:48</div><div class="date">4월 3일 화요일</div><div class="notice">✉ 새 메시지 ${people.reduce((n,p)=>n+p.messages.length,0)}개</div><p>잠금 해제 패턴을 그리세요</p><div class="pattern">${Array.from({length:9},()=>`<button class="dot" onclick="showHome()"></button>`).join("")}</div><button class="unlock" onclick="showHome()">잠금 해제</button></div>`;
}
function showHome(){
$("screen").className="screen wallpaper";
$("screen").innerHTML=`<div class="home"><div class="widget"><div><div class="bigtime" id="ht">11:48</div>4월 3일 화요일</div><div>서울<br><br>9°　맑음</div></div><div class="apps">${app("◎","인터넷","blue","simplePage('인터넷')")}${app("▦","캘린더","white","simplePage('캘린더')")}${app("▤","메모","yellow","simplePage('메모')")}${app("◷","시계","white","simplePage('시계')")}${app("▧","갤러리","orange","simplePage('갤러리')")}${app("♫","음악","purple","simplePage('음악')")}</div></div><div class="dock">${app("☎","전화","green","showContacts()")}${app("▣","연락처","orange","showContacts()")}${app("✉","메시지","yellow","showMessages()")}${app("▦","앱","blue","showAll()")}</div>`;
}
function page(title,html){$("screen").className="screen page";$("screen").innerHTML=`<div class="bar"><button class="back" onclick="showHome()">‹</button>${title}</div>${html}`}
function showMessages(){
page("메시지",`<div style="padding:10px"><button class="btn" onclick="editPerson(-1)">＋ 새 대화 / 연락처 추가</button></div>`+people.map((p,i)=>{let last=p.messages[p.messages.length-1]||{text:"대화 없음"};return `<button class="rowitem" onclick="showChat(${i})">${avatar(p)}<span class="rowtext"><div class="name">${esc(p.name)}</div><div class="preview">${esc(last.text)}</div></span><span class="time">${esc(last.time||"")}</span></button>`}).join(""));
}
function showContacts(){
page("연락처",`<div style="padding:10px"><button class="btn" onclick="editPerson(-1)">＋ 연락처 추가</button></div>`+people.map((p,i)=>`<button class="rowitem" onclick="contactDetail(${i})">${avatar(p)}<span class="rowtext"><div class="name">${esc(p.name)}</div><div class="preview">가상 연락처 · 눌러서 상세 보기</div></span>›</button>`).join("")+`<div class="info">사진은 공개적으로 접근 가능한 이미지 주소를 등록할 수 있어. 실제 개인정보 대신 가상 인물을 사용해 줘.</div>`);
}
function contactDetail(i){
let p=people[i];
page("연락처 정보",`<div class="form" style="text-align:center">${avatar(p)}<h2>${esc(p.name)}</h2><button class="btn" onclick="showChat(${i})">문자 보내기</button><button class="btn secondary" onclick="editPerson(${i})">연락처 수정</button><button class="btn secondary" onclick="deletePerson(${i})">삭제</button></div>`);
}
function editPerson(i){
let p=i<0?{name:"",photo:"",messages:[]}:people[i];
page(i<0?"연락처 추가":"연락처 수정",`<div class="form"><label>이름</label><input id="pn" value="${esc(p.name)}" placeholder="예: 김민재"><label>프로필 사진 URL (선택)</label><input id="pp" value="${esc(p.photo)}" placeholder="https://...jpg"><label>첫 문자 (새 연락처만)</label><textarea id="pm" placeholder="처음 온 문자 내용을 입력해 줘"></textarea><button class="btn" onclick="savePerson(${i})">저장</button><button class="btn secondary" onclick="${i<0?"showContacts()":"contactDetail("+i+")"}">취소</button><p class="info">사진은 이미지의 직접 주소를 입력해야 표시돼. 사진 주소를 모르면 비워 둬도 괜찮아.</p></div>`);
}
function savePerson(i){
let name=$("pn").value.trim(),photo=$("pp").value.trim(),msg=$("pm").value.trim();
if(!name){alert("이름을 입력해 줘!");return}
if(i<0){people.unshift({name,photo,time:now(),messages:msg?[{text:msg,me:false,time:now()}]:[]});save();showContacts()}
else{people[i].name=name;people[i].photo=photo;save();contactDetail(i)}
}
function deletePerson(i){if(confirm("이 연락처를 삭제할까?")){people.splice(i,1);save();showContacts()}}
function showChat(i){
current=i;let p=people[i];
page("메시지",`<div class="chathead">${avatar(p)}<strong>${esc(p.name)}</strong><button class="btn secondary" onclick="editPerson(${i})">수정</button></div><div class="chatbody" id="cb"></div><form class="chatinput" onsubmit="send(event)"><input id="msg" placeholder="메시지 입력..." autocomplete="off"><button class="send">전송</button></form><div class="info">대화 내용은 이 브라우저에 저장돼. 다른 기기와 자동으로 동기화되지는 않아.</div>`);
renderChat();
}
function renderChat(){
let c=$("cb");if(!c)return;
let p=people[current];
c.innerHTML=p.messages.map(m=>`<div class="msgrow ${m.me?"me":""}">${m.me?`<span class="btime">${esc(m.time||"")}</span>`:""}<div class="bubble ${m.me?"me":""}">${esc(m.text)}${!m.me?`<div class="btime">${esc(m.time||"")}</div>`:""}</div>${!m.me?`<span class="btime">${esc(m.time||"")}</span>`:""}</div>`).join("")||`<div class="info" style="text-align:center">아직 대화가 없어. 첫 메시지를 보내 봐!</div>`;
}
function send(e){
e.preventDefault();let input=$("msg"),text=input.value.trim();if(!text)return;
let t=now();people[current].messages.push({text,me:true,time:t});people[current].time=t;save();renderChat();input.value="";
}
function showAll(){page("애플리케이션",`<div class="form"><button class="btn" onclick="showContacts()">연락처</button><button class="btn" onclick="showMessages()">메시지</button><button class="btn" onclick="simplePage('메모')">메모</button><button class="btn" onclick="simplePage('갤러리')">갤러리</button><button class="btn" onclick="simplePage('시계')">시계</button></div>`)}
function simplePage(name){page(name,`<div class="form"><h3>${name}</h3><p>옛날 갤럭시 느낌의 ${name} 화면이야.</p>${name==="메모"?`<textarea id="memo" placeholder="메모를 입력해 줘"></textarea><button class="btn" onclick="localStorage.setItem('galaxyMemo',$('memo').value);alert('메모를 저장했어!')">저장</button>`:name==="갤러리"?`<p>가상 사진은 연락처 수정에서 이미지 URL을 넣어 등록할 수 있어.</p>`:`<p>상황극용 화면</p>`}</div>`);if(name==="메모")$("memo").value=localStorage.getItem("galaxyMemo")||""}
function tick(){let d=new Date(),h=d.getHours(),t=(h%12||12)+":"+String(d.getMinutes()).padStart(2,"0");$("st").textContent=(h>=12?"오후 ":"오전 ")+t;let c=$("clock");if(c)c.textContent=t;let ht=$("ht");if(ht)ht.textContent=t}
showLock();setInterval(tick,1000);
</script>
</body>
</html>
