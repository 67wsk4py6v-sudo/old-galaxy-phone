
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Old Galaxy</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#fff;font-family:Arial,"Apple SD Gothic Neo",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}
#phone{max-width:430px;min-height:100dvh;margin:auto;background:#07101e;overflow:hidden}
.status{height:28px;background:#17191d;display:flex;justify-content:space-between;padding:5px 12px;font-size:13px}
.screen{min-height:calc(100dvh - 76px)}
.wallpaper{background:radial-gradient(ellipse at 25% 15%,#d7f7ff 0%,#7edbff 15%,transparent 38%),radial-gradient(ellipse at 85% 38%,#63d7ff 0%,transparent 35%),linear-gradient(145deg,#159be9,#0873df 45%,#063d9d 80%,#05235e)}
.lock{text-align:center;padding:48px 20px}.clock{font-size:64px;font-weight:300}.date{margin-top:8px}
.notice{margin:40px 0 22px;background:#092f5b9c;padding:14px;border-radius:9px}
.pattern{display:grid;grid-template-columns:repeat(3,45px);gap:24px;justify-content:center;margin:22px}
.dot{width:42px;height:42px;border:3px solid #d7efff99;border-radius:50%;background:#bce8ff44}
.unlock{border:1px solid #ffffff88;border-radius:20px;background:#134e8a88;color:#fff;padding:10px 20px}
.home{padding:16px 13px 100px}.widget{padding:18px;background:#a9e5ff36;border:1px solid #ffffff55;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.bigtime{font-size:40px;font-weight:300}.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 5px;margin-top:32px}
.app{border:0;background:transparent;color:white;text-align:center;padding:0;text-shadow:0 2px 3px #123}
.appicon{width:54px;height:54px;border-radius:13px;margin:0 auto 7px;display:grid;place-items:center;font-size:27px;border:2px solid #ffffff66;box-shadow:inset 0 2px 4px #ffffff88}
.app span:last-child{font-size:12px}.blue{background:linear-gradient(#83d6ff,#1473d0)}.yellow{background:linear-gradient(#fff4a4,#e9b51c);color:#72521a}
.orange{background:linear-gradient(#ffd08d,#e97622)}.purple{background:linear-gradient(#f2baff,#a345ce)}.green{background:linear-gradient(#b5f3a3,#26a54c)}.white{background:linear-gradient(#fff,#b9c7d8);color:#333}
.dock{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#052e65e8;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 4px}
.nav{height:48px;background:linear-gradient(#25282d,#090a0d);display:flex;justify-content:space-around;align-items:center;color:#bbb}
.page{background:#080808;min-height:calc(100dvh - 76px)}
.bar{height:52px;background:linear-gradient(#555b64,#17191d);padding:13px;font-size:18px;font-weight:bold;position:sticky;top:0;z-index:2}
.back{border:0;background:transparent;color:white;font-size:24px;margin-right:12px}
.rowitem{width:100%;border:0;border-bottom:1px solid #303030;background:linear-gradient(#101010,#030303);color:white;text-align:left;display:flex;align-items:center;gap:13px;padding:15px 13px;min-height:82px}
.avatar{width:58px;height:58px;border-radius:7px;background:linear-gradient(#777f8c,#404651);display:grid;place-items:center;font-size:27px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}.rowtext{min-width:0;flex:1}
.name{font-size:17px;font-weight:bold;margin-bottom:10px}.preview{color:#999;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:#999;font-size:12px;white-space:nowrap;align-self:flex-start;padding-top:5px}
.badge{background:#329fe9;border-radius:50%;min-width:25px;height:25px;padding:4px 7px;display:inline-grid;place-items:center;margin-top:5px;font-weight:bold;font-size:12px}
.chathead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;background:linear-gradient(#555b64,#17191d);border-bottom:1px solid #333}
.chathead .avatar{width:36px;height:36px}
.chatbody{padding:14px 12px;min-height:55vh;display:flex;flex-direction:column;gap:12px;background:radial-gradient(ellipse at top,#25282b,#101112 70%)}
.day{text-align:center;color:#aaa;font-size:12px;margin:8px}
.bubble{padding:12px 14px;border-radius:15px;max-width:82%;font-size:15px;line-height:1.5;background:linear-gradient(#fff,#e0e4e8);color:#111;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 2px #0008}
.bubble.me{background:linear-gradient(#fff29b,#f4df55);color:#111;align-self:flex-end}
.btime{font-size:10px;color:#aaa;white-space:nowrap;align-self:flex-end;margin-bottom:4px}
.msgrow{display:flex;align-items:flex-end;gap:6px}.msgrow.me{justify-content:flex-end}
.chatinput{display:flex;gap:6px;padding:10px;background:linear-gradient(#353535,#191919);position:sticky;bottom:0}
.chatinput input{flex:1;min-width:0;border-radius:7px;border:2px solid #888;background:#fff;color:#111;padding:12px;font-size:16px}
.send{background:linear-gradient(#fff,#bbb);color:#111;border:2px solid #888;border-radius:7px;padding:0 16px;font-weight:bold}
.form{padding:15px}.form label{display:block;font-size:13px;color:#bbb;margin-top:13px}
.form input,.form textarea{width:100%;background:#22252c;color:white;border:1px solid #555;border-radius:7px;padding:11px;margin-top:6px}
.form textarea{min-height:100px;resize:vertical}.btn{background:#2185d0;color:white;border:0;border-radius:7px;padding:11px 13px;margin:8px 5px 5px 0}.secondary{background:#414650}
.info{padding:15px;color:#aaa;font-size:12px;line-height:1.6}
.callveil{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#233b54,#07101e 65%,#02060b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12vh 24px 8vh;text-align:center}
.calltop{font-size:13px;color:#d7e6f4;letter-spacing:2px}.callavatar{width:112px;height:112px;border-radius:50%;background:linear-gradient(#9da9b7,#4b5665);display:grid;place-items:center;font-size:52px;border:3px solid #ffffff66;margin:28px auto 20px}.callname{font-size:30px;font-weight:500}.callstatus{margin-top:12px;color:#d6e2ee}.callbuttons{width:100%;display:flex;justify-content:space-around;align-items:center;gap:30px}.callbtn{border:0;border-radius:50%;width:72px;height:72px;color:#fff;font-size:30px;box-shadow:0 5px 18px #0006}.reject{background:#e84444}.answer{background:#26b765}.hangup{background:#e84444}.callhint{font-size:12px;color:#b7c8d8;margin-top:18px}.calllogrow{padding:14px;border-bottom:1px solid #333;display:flex;gap:12px;align-items:center}.calllogrow .who{flex:1}.missed{color:#ff6464}.calllogrow small{display:block;color:#999;margin-top:5px}
</style>
</head>
<body>
<div id="phone">
<div class="status"><span>✉</span><span>▮▮▮ 3G ▣ <span id="st">오후 11:48</span></span></div>
<main id="screen" class="screen wallpaper"></main>
<div class="nav"><span>▤</span><span>▱</span><span>↶</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const initial=[];
let people;
try {
  people=JSON.parse(localStorage.getItem("galaxyPeople"))||initial;
  if(!Array.isArray(people)) people=initial;
  people=people.map(p=>({...p,photo:p.photo||"",messages:Array.isArray(p.messages)?p.messages:[],unread:Number(p.unread)||0}));
} catch(e){people=initial}
const save=()=>{try{localStorage.setItem("galaxyPeople",JSON.stringify(people))}catch(e){}};
let current=0;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>{let d=new Date(),h=d.getHours();return (h>=12?"오후 ":"오전 ")+(h%12||12)+":"+String(d.getMinutes()).padStart(2,"0")};
function avatar(p){return `<span class="avatar">${p.photo?`<img src="${esc(p.photo)}" onerror="this.style.display='none'">`:"👤"}</span>`}
function app(icon,label,color,fn){return `<button class="app" onclick="${fn}"><span class="appicon ${color}">${icon}</span><span>${label}</span></button>`}
function showLock(){
 $("screen").className="screen wallpaper";
 const count=people.reduce((n,p)=>n+(p.unread||0),0);
 $("screen").innerHTML=`<div class="lock"><div class="clock" id="clock">11:48</div><div class="date">4월 3일 화요일</div><div class="notice">✉ 새 메시지 ${count}개</div><p>잠금 해제 패턴을 그리세요</p><div class="pattern">${Array.from({length:9},()=>`<button class="dot" onclick="showHome()"></button>`).join("")}</div><button class="unlock" onclick="showHome()">잠금 해제</button></div>`;
}
function showHome(){
 $("screen").className="screen wallpaper";
 $("screen").innerHTML=`<div class="home"><div class="widget"><div><div class="bigtime" id="ht">11:48</div>4월 3일 화요일</div><div>서울<br><br>9°　맑음</div></div><div class="apps">${app("◎","인터넷","blue","simplePage('인터넷')")}${app("▦","캘린더","white","simplePage('캘린더')")}${app("▤","메모","yellow","simplePage('메모')")}${app("◷","시계","white","simplePage('시계')")}${app("▧","갤러리","orange","simplePage('갤러리')")}${app("♫","음악","purple","simplePage('음악')")}</div></div><div class="dock">${app("☎","전화","green","showContacts()")}${app("▣","연락처","orange","showContacts()")}${app("✉","메시지","yellow","showMessages()")}${app("▦","앱","blue","showAll()")}</div>`;
}
function page(title,html){$("screen").className="screen page";$("screen").innerHTML=`<div class="bar"><button class="back" onclick="showHome()">‹</button>${title}</div>${html}`}
function lastMessage(p){return p.messages[p.messages.length-1]||{text:"대화 없음",time:""}}
function showMessages(){
 page("메시지",`<div style="padding:10px"><button class="btn" onclick="editPerson(-1)">＋ 새 대화 / 연락처 추가</button></div>`+
 people.map((p,i)=>{let last=lastMessage(p);return `<button class="rowitem" onclick="showChat(${i})">${avatar(p)}<span class="rowtext"><div class="name">${esc(p.name)}</div><div class="preview">${esc(last.text)}</div></span><span><div class="time">${esc(last.time||"")}</div>${p.unread?`<span class="badge">${p.unread}</span>`:""}</span></button>`}).join(""));
}
function showContacts(){
 page("연락처",`<div style="padding:10px"><button class="btn" onclick="editPerson(-1)">＋ 연락처 추가</button></div>`+people.map((p,i)=>`<button class="rowitem" onclick="contactDetail(${i})">${avatar(p)}<span class="rowtext"><div class="name">${esc(p.name)}</div><div class="preview">가상 연락처 · 눌러서 상세 보기</div></span>›</button>`).join("")+`<div class="info">실제 개인정보 대신 가상 인물을 사용해 줘.</div>`);
}
function contactDetail(i){
 let p=people[i];
 page("연락처 정보",`<div class="form" style="text-align:center">${avatar(p)}<h2>${esc(p.name)}</h2><button class="btn" onclick="showChat(${i})">문자 보내기</button><button class="btn secondary" onclick="editPerson(${i})">연락처 수정</button><button class="btn secondary" onclick="deletePerson(${i})">삭제</button></div>`);
}
function editPerson(i){
 let p=i<0?{name:"",photo:"",messages:[]}:people[i];
 page(i<0?"연락처 추가":"연락처 수정",`<div class="form"><label>이름</label><input id="pn" value="${esc(p.name)}" placeholder="예: 김민재"><label>프로필 사진 URL (선택)</label><input id="pp" value="${esc(p.photo)}" placeholder="https://...jpg"><label>첫 문자 (새 연락처만)</label><textarea id="pm" placeholder="처음 온 문자 내용을 입력해 줘"></textarea><button class="btn" onclick="savePerson(${i})">저장</button><button class="btn secondary" onclick="${i<0?"showContacts()":"contactDetail("+i+")"}">취소</button><p class="info">사진 주소를 모르면 비워 둬도 괜찮아.</p></div>`);
}
function savePerson(i){
 let name=$("pn").value.trim(),photo=$("pp").value.trim(),msg=$("pm").value.trim();
 if(!name){alert("이름을 입력해 줘!");return}
 if(i<0){people.unshift({name,photo,time:now(),unread:msg?1:0,messages:msg?[{text:msg,me:false,time:now()}]:[]});save();showContacts()}
 else{people[i].name=name;people[i].photo=photo;save();contactDetail(i)}
}
function deletePerson(i){if(confirm("이 연락처를 삭제할까?")){people.splice(i,1);save();showContacts()}}
function showChat(i){
 current=i;let p=people[i];p.unread=0;save();
 page("메시지",`<div class="chathead">${avatar(p)}<strong style="flex:1">${esc(p.name)}</strong><button class="btn secondary" onclick="editPerson(${i})">수정</button></div><div class="chatbody" id="cb"></div><form class="chatinput" onsubmit="send(event)"><input id="msg" placeholder="메시지 입력..." autocomplete="off"><button class="send">전송</button></form><div class="info">대화는 이 브라우저에 저장돼. 자동 답장은 가상 연출이며 실제 상대방에게 전송되지 않아.</div>`);
 renderChat();
}
function renderChat(){
 let c=$("cb");if(!c)return;
 let p=people[current];
 c.innerHTML=p.messages.map(m=>`<div class="msgrow ${m.me?"me":""}">${m.me?`<span class="btime">${esc(m.time||"")}</span>`:""}<div class="bubble ${m.me?"me":""}">${esc(m.text)}${!m.me?`<div class="btime">${esc(m.time||"")}</div>`:""}</div>${!m.me?`<span class="btime">${esc(m.time||"")}</span>`:""}</div>`).join("")||`<div class="info" style="text-align:center">아직 대화가 없어. 첫 메시지를 보내 봐!</div>`;
 c.scrollTop=c.scrollHeight;
}
function send(e){
 e.preventDefault();
 let input=$("msg"),text=input.value.trim();if(!text)return;
 let p=people[current],t=now();
 p.messages.push({text,me:true,time:t});p.time=t;save();renderChat();input.value="";
 // 자동 답장은 보내지 않아요. 사건에 따른 연락만 별도로 도착해요.
}
const incidentKey="galaxyChenleNewsIncident_v1";
const incidentTimeline=[
 {after:0,messages:[["런쥔","천러야 기사 봤어? 지금 괜찮아? 연락 좀 줘."],["제노","방금 기사 봤는데 무슨 상황인지 알아? 전화 가능해?"],["매니저형","천러야, 기사 확인했어. 지금 어디야? 우선 전화부터 받아."]]},
 {after:12000,messages:[["해찬","야 너 괜찮은 거 맞지? 단톡도 안 보고 뭐 해."],["재민","천러야, 기사 내용이 사실인지 아닌지보다 네가 괜찮은지가 먼저야. 답장해 줘."],["박지성","형 연락이 안 돼서요… 혹시 휴대폰 못 보고 있는 거예요?"]]},
 {after:30000,messages:[["매니저형","회사에서도 연락 왔어. 지금 바로 통화해야 해. 어디 있는지 알려 줘."],["회사 담당자","천러 씨, 관련 기사 확산 상황을 확인 중입니다. 연락 가능한 즉시 담당 매니저에게 회신 부탁드립니다."],["런쥔","천러야, 나한테라도 한마디 해. 다들 너 찾고 있어."]]},
 {after:55000,messages:[["제노","회사 쪽에서 추가 확인 중이래. 지금 혼자 있는 거야?"],["해찬","기사 하나로 끝나는 분위기가 아닌 것 같은데… 너한테 무슨 일 생긴 건 아니지?"],["매니저형","전화 계속 안 받으면 직접 확인하러 갈 수밖에 없어. 위치라도 보내."]]},
 {after:90000,messages:[["회사 담당자","추가 게시물이 올라와 온라인 반응이 커지고 있습니다. 현재 상황을 확인할 수 있도록 담당자와 통화 부탁드립니다."],["재민","천러야, 답장 안 해도 되니까 메시지 하나만 확인 표시해 줘. 진짜 걱정돼."],["박지성","형, 무슨 일이든 혼자 감당하지 마요. 우리 다 기다리고 있어요."]]},
 {after:135000,messages:[["런쥔","방금 새로운 글까지 올라왔어. 이거 네가 직접 본 거 맞아?"],["제노","매니저형이 너랑 연락이 안 된다고 했어. 나 지금 전화 다시 할게."],["매니저형","천러야, 이건 그냥 기사 대응 문제만이 아니야. 네가 연락이 안 돼서 다들 걱정하고 있어. 제발 답장해."]]},
 {after:195000,messages:[["회사 담당자","현재 추가 확인이 필요한 내용이 있습니다. 사실관계 확인 전까지 개인 계정에 별도 게시물을 올리지 말아 주세요. 담당 매니저와 연락 부탁드립니다."],["해찬","야… 진짜 무슨 일 있는 거 아니지? 아까부터 분위기가 너무 이상해."],["재민","우리 지금 다 연락 돌리고 있어. 네가 어디 있는지만 알려 줘. 부탁이야."]]},
 {after:270000,messages:[["매니저형","천러야, 지금부터 연락 오는 거 하나라도 확인하면 바로 답해. 회사도 상황 심각하게 보고 있어."],["런쥔","기사 내용이 계속 바뀌고 있어. 네 얘기를 직접 듣기 전에는 아무것도 판단 안 할게. 연락 줘."],["제노","나 계속 전화하고 있어. 제발 무사하다고만 해 줘."]]},
 {after:360000,messages:[["회사 담당자","상황이 계속 확산되고 있어 담당 매니저와의 긴급 확인이 필요합니다. 연락이 닿는 즉시 회신 부탁드립니다."],["박지성","형… 다들 기다리고 있어요. 저도 계속 휴대폰 보고 있어요."],["매니저형","천러야. 부탁이다. 지금 어디 있는지, 괜찮은지만 알려 줘. 더는 기다리기 힘들어."]]}
];
function incidentTime(ms){const d=new Date(ms),h=d.getHours();return (h>=12?"오후 ":"오전 ")+(h%12||12)+":"+String(d.getMinutes()).padStart(2,"0")}
function ensureIncidentContacts(){
 [{name:"매니저형"},{name:"회사 담당자"}].forEach(x=>{if(!people.some(p=>p.name===x.name))people.push({...x,photo:"",messages:[],unread:0,time:""})});
 save();
}
function runIncident(){
 ensureIncidentContacts();let state;
 try{state=JSON.parse(localStorage.getItem(incidentKey)||"null")}catch(e){state=null}
 if(!state||!state.startAt){state={startAt:Date.now(),step:0};localStorage.setItem(incidentKey,JSON.stringify(state))}
 const elapsed=Date.now()-state.startAt;let changed=false;
 while(state.step<incidentTimeline.length&&elapsed>=incidentTimeline[state.step].after){
  const stage=incidentTimeline[state.step];
  stage.messages.forEach(([name,text],j)=>{
   let i=people.findIndex(p=>p.name===name);
   if(i<0){people.push({name,photo:"",messages:[],unread:0,time:""});i=people.length-1}
   const p=people[i],scheduled=state.startAt+stage.after+j*1800;
   p.messages.push({text,me:false,time:incidentTime(scheduled),incident:true});p.time=incidentTime(scheduled);
   if(current!==i)p.unread=(p.unread||0)+1;changed=true;
  });
  state.step++;
 }
 if(changed){save();localStorage.setItem(incidentKey,JSON.stringify(state));if($("cb"))renderChat()}
}
function showAll(){page("애플리케이션",`<div class="form"><button class="btn" onclick="showContacts()">연락처</button><button class="btn" onclick="showMessages()">메시지</button><button class="btn" onclick="showCallLog()">📞 통화 기록</button><button class="btn" onclick="simplePage('메모')">메모</button><button class="btn" onclick="simplePage('갤러리')">갤러리</button><button class="btn" onclick="simplePage('시계')">시계</button></div>`)}
const callLogKey="galaxyChenleCallLog_v1";
const callTimeline=[
 {after:18000,name:"런쥔",reason:"기사 보고 걱정돼서 전화했어"},
 {after:72000,name:"매니저형",reason:"긴급 확인이 필요해"},
 {after:150000,name:"제노",reason:"연락이 안 돼서 전화했어"},
 {after:285000,name:"회사 담당자",reason:"상황 확인 요청"},
 {after:420000,name:"해찬",reason:"천러야, 전화 좀 받아 봐"}
];
let activeCall=null,callInterval=null;
function getCallLog(){try{return JSON.parse(localStorage.getItem(callLogKey)||"[]")}catch(e){return []}}
function addCallLog(name,type,stamp){let a=getCallLog();a.unshift({name,type,time:incidentTime(stamp||Date.now())});localStorage.setItem(callLogKey,JSON.stringify(a))}
function showIncomingCall(name,reason,stamp){
 if(activeCall){addCallLog(name,"부재중 전화",stamp);return}
 activeCall={name,reason,stamp:stamp||Date.now(),answered:false};
 const veil=document.createElement("div");veil.className="callveil";veil.id="callveil";
 veil.innerHTML=`<div class="calltop">GALAXY · 수신 전화</div><div><div class="callavatar">${name.includes("회사")?"🏢":name.includes("매니저")?"👔":"👤"}</div><div class="callname">${esc(name)}</div><div class="callstatus">휴대전화로 전화가 오고 있습니다</div><div class="callhint">${esc(reason)}</div></div><div class="callbuttons"><div><button class="callbtn reject" onclick="declineCall()">☎</button><div class="callhint">거절</div></div><div><button class="callbtn answer" onclick="answerCall()">☎</button><div class="callhint">받기</div></div></div>`;
 document.body.appendChild(veil);
 callInterval=setTimeout(()=>{if(activeCall&&!activeCall.answered)declineCall(true)},25000);
}
function declineCall(){if(!activeCall)return;clearTimeout(callInterval);addCallLog(activeCall.name,"부재중 전화",activeCall.stamp);const v=document.getElementById("callveil");if(v)v.remove();activeCall=null}
function answerCall(){
 if(!activeCall)return;clearTimeout(callInterval);activeCall.answered=true;addCallLog(activeCall.name,"받은 전화",activeCall.stamp);
 const name=activeCall.name,v=document.getElementById("callveil");if(!v)return;
 v.innerHTML=`<div class="calltop">GALAXY · 통화 중</div><div><div class="callavatar">${name.includes("회사")?"🏢":name.includes("매니저")?"👔":"👤"}</div><div class="callname">${esc(name)}</div><div class="callstatus" id="calltimer">00:01</div><div class="callhint">가상 통화 화면 · 실제 통화는 연결되지 않아요</div><div class="callhint">${esc(activeCall.reason)}</div></div><div class="callbuttons"><div><button class="callbtn hangup" onclick="endCall()">☎</button><div class="callhint">통화 종료</div></div></div>`;
 let sec=1;callInterval=setInterval(()=>{const el=document.getElementById("calltimer");if(el){sec++;el.textContent=String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")}},1000)
}
function endCall(){if(callInterval)clearInterval(callInterval);const v=document.getElementById("callveil");if(v)v.remove();activeCall=null;callInterval=null}
function showCallLog(){const log=getCallLog();page("통화 기록",log.length?log.map(c=>`<div class="calllogrow">${c.type.includes("부재중")?'<span class="missed">☎</span>':'<span>☎</span>'}<span class="who">${esc(c.name)}<small class="${c.type.includes("부재중")?'missed':''}">${esc(c.type)}</small></span><small>${esc(c.time)}</small></div>`).join(""):`<div class="info">아직 통화 기록이 없어. 기사 관련 전화가 오면 여기에 남아.</div>`)}

function runCallTimeline(){
 let state;
 try{
  state=JSON.parse(localStorage.getItem(incidentKey)||"null");
 }catch(e){state=null;}
 if(!state||!state.startAt)return;

 let cstate;
 try{
  cstate=JSON.parse(localStorage.getItem("galaxyChenleCallState_v1")||"null");
 }catch(e){cstate=null;}
 if(!cstate)cstate={step:0};

 const elapsed=Date.now()-state.startAt;

 while(cstate.step<callTimeline.length &&
       elapsed>=callTimeline[cstate.step].after){

  const c=callTimeline[cstate.step];
  const stamp=state.startAt+c.after;

  if(c.name==="박지성" &&
     elapsed-c.after<30000 &&
     !activeCall){
    showIncomingCall(c.name,c.reason,stamp);
  }else{
    addCallLog(c.name,"부재중 전화",stamp);
  }

  cstate.step++;
 }
localStorage.setItem(
  "galaxyChenleCallState_v1",
  JSON.stringify(cstate)
 );
}
function simplePage(name){page(name,`<div class="form"><h3>${name}</h3><p>옛날 갤럭시 느낌의 ${name} 화면이야.</p>${name==="메모"?`<textarea id="memo" placeholder="메모를 입력해 줘"></textarea><button class="btn" onclick="localStorage.setItem('galaxyMemo',$('memo').value);alert('메모를 저장했어!')">저장</button>`:name==="갤러리"?`<p>가상 사진은 연락처 수정에서 이미지 URL을 넣어 등록할 수 있어.</p>`:`<p>상황극용 화면</p>`}</div>`);if(name==="메모")$("memo").value=localStorage.getItem("galaxyMemo")||""}
function tick(){let d=new Date(),h=d.getHours(),t=(h%12||12)+":"+String(d.getMinutes()).padStart(2,"0");$("st").textContent=(h>=12?"오후 ":"오전 ")+t;let c=$("clock");if(c)c.textContent=t;let ht=$("ht");if(ht)ht.textContent=t}
showLock();
setInterval(tick,1000);
runIncident();
runCallTimeline();
setInterval(()=>{
  runIncident();
  runCallTimeline();
},3000);
</script>
</body>
</html>
